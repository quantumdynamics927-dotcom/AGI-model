name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'space_app.py'
      - 'Dockerfile.space'
      - 'README_HF_SPACE.md'
      - 'requirements.txt'
      - '.github/workflows/sync-to-huggingface.yml'
  release:
    types: [published]

jobs:
  deploy-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Git LFS
        run: git lfs install
      
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: Create deployment directory
        run: |
          mkdir -p hf-deploy
          cd hf-deploy
          git init
      
      - name: Copy Space files only
        run: |
          cp space_app.py hf-deploy/
          cp Dockerfile.space hf-deploy/Dockerfile
          cp README_HF_SPACE.md hf-deploy/README.md
          cp requirements.txt hf-deploy/
          
          # Create .gitignore for Space
          cat > hf-deploy/.gitignore << 'EOF'
          *.pyc
          __pycache__/
          *.py[cod]
          .env
          *.log
          *.md
          !README.md
          EOF
      
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
        run: |
          cd hf-deploy
          git add .
          git commit -m "Deploy from GitHub: ${{ github.sha }}"
          
          # Push to Hugging Face Space
          git push https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/agi-model main --force
          
          echo "✅ Deployed to Hugging Face Space"
          echo "🔗 View at: https://huggingface.co/spaces/${HF_USER}/agi-model"
