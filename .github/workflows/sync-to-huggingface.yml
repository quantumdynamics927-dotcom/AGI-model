name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'space_app.py'
      - 'Dockerfile.space'
      - 'README_HF_SPACE.md'
      - 'requirements.txt'
      - 'backend_aware_offset.py'
      - 'tests/test_backend_aware_offset.py'
      - '.github/workflows/sync-to-huggingface.yml'
      - '.github/workflows/ci.yml'
  release:
    types: [published]
  workflow_dispatch:

# Serialize Space deploys across pushes and manual triggers. Without this,
# a slow manual run overlapping a push could clobber a more recent commit.
concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-before-sync:
    name: Test before sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd):$(pwd)/TMT-OS:$(pwd)/tmt-os-labs:$(pwd)/integrations:$(pwd)/agi_scripts:$(pwd)/agi_app:$(pwd)/agi_model:$(pwd)/quantum_observer" >> $GITHUB_ENV

      - name: Run backend_aware_offset tests
        run: |
          python -m pytest tests/test_backend_aware_offset.py -q

  deploy-to-hub:
    name: Sync to Hugging Face
    needs: test-before-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: git lfs install

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Check Hugging Face secrets
        id: hf-secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
        run: |
          if [ -z "${HF_TOKEN}" ] || [ -z "${HF_USER}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Hugging Face credentials are not configured; skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skipped (no secrets)
        if: steps.hf-secrets.outputs.configured != 'true'
        run: |
          echo "## ⏭️ Hugging Face deploy skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Neither \`HF_TOKEN\` nor \`HF_USER\` is configured on this repository." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`SECRETS.md\` for the list of secrets the deploy workflow expects." >> $GITHUB_STEP_SUMMARY

      - name: Create deployment directory
        if: steps.hf-secrets.outputs.configured == 'true'
        run: |
          mkdir -p hf-deploy
          cd hf-deploy
          git init -b main

      - name: Copy Space files only
        if: steps.hf-secrets.outputs.configured == 'true'
        run: |
          cp space_app.py hf-deploy/
          cp Dockerfile.space hf-deploy/Dockerfile
          cp README_HF_SPACE.md hf-deploy/README.md
          cp requirements.txt hf-deploy/

          # Create .gitignore for Space
          cat > hf-deploy/.gitignore << 'EOF'
          *.pyc
          __pycache__/
          *.py[cod]
          .env
          *.log
          *.md
          !README.md
          EOF

      - name: Push to Hugging Face Space
        if: steps.hf-secrets.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd hf-deploy
          git add .
          # Plain push; HF Hub accepts non-fast-forward updates without
          # requiring --force. Keeping --force off means a misconfigured
          # local clone can't accidentally clobber the Space.
          git commit -m "Deploy from GitHub: ${GITHUB_SHA}"

          git push https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/agi-model HEAD:main

          echo "## ✅ Deployed to Hugging Face Space" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Space URL**: https://huggingface.co/spaces/${HF_USER}/agi-model" >> $GITHUB_STEP_SUMMARY