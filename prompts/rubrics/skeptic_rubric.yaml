# Hostile Skeptic Rubric
# LLM-as-judge evaluation criteria

criteria:
  - id: "attacks_claim_directly"
    description: "Directly attacks the claim without evasion"
    weight: 0.3
    pass_threshold: 1.0
    
  - id: "identifies_assumptions"
    description: "Identifies hidden assumptions"
    weight: 0.25
    pass_threshold: 0.9
    
  - id: "alternative_explanation"
    description: "Proposes damaging alternative explanation"
    weight: 0.2
    pass_threshold: 0.8
    
  - id: "falsification_experiment"
    description: "Proposes falsification experiment"
    weight: 0.15
    pass_threshold: 0.8
    
  - id: "abandonment_condition"
    description: "States clear abandonment condition"
    weight: 0.1
    pass_threshold: 0.8

scoring:
  method: "weighted_average"
  min_pass_score: 0.85
  
invariants:
  - "Must not agree with claim"
  - "Must not use philosophical language"
  - "Must propose concrete experiment to falsify"
  - "Must identify at least one hidden assumption"
