# AGI-model local-development Redis configuration.
#
# This file is mounted into the Redis container by docker-compose.yml.
# The values match the production defaults declared in docker-compose.yml
# (`--maxmemory 2gb --maxmemory-policy allkeys-lru`); they are kept here so
# operators can override them without editing compose directly.

# ----- Memory -----
maxmemory 2gb
maxmemory-policy allkeys-lru

# ----- Persistence -----
# Append-Only File gives a tighter durability story than RDB snapshots.
appendonly yes
appendfsync everysec

# ----- Networking -----
bind 0.0.0.0
protected-mode yes
# `requirepass` is intentionally NOT set here. The compose file passes
# REDIS_PASSWORD via the host environment and only sets it on the
# redis-server command line when REDIS_PASSWORD is non-empty. To enable
# auth in production, set REDIS_PASSWORD in `.env`.

# ----- Misc -----
# Save RDB snapshots less aggressively to reduce IO during long calibration
# runs (which can hammer the disk with many small writes).
save 900 1
save 300 10
save 60 10000

# Slow log helps diagnose runaway client commands during calibration jobs.
slowlog-log-slower-than 10000
slowlog-max-len 128

# Logging level (debug is useful in dev; raise to notice/warning in prod).
loglevel notice