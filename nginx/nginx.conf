# AGI-model nginx reverse proxy.
#
# Mounted by docker-compose.yml into /etc/nginx/nginx.conf when the
# `loadbalancer` profile is enabled. This is intentionally minimal: it
# terminates plain HTTP and forwards to the API and dashboard. TLS,
# caching, and rate limiting are explicitly out of scope here and should
# be added at the edge (e.g. via Cloudflare, an ALB, or a separate
# hardened proxy).
#
# To enable: `docker compose --profile loadbalancer up -d`

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;

    upstream tmt_os_api {
        server tmt-os-api:8000;
    }

    upstream tmt_os_dashboard {
        server tmt-os-dashboard:8501;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Hard cap on request body size to keep the API safe from accidental
        # large uploads. Calibration reports are < 1 MB.
        client_max_body_size 2m;

        # Health endpoint for compose's docker healthcheck.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Streamlit dashboard on the root path.
        location / {
            proxy_pass http://tmt_os_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Streamlit's WebSocket frames can sit idle for a long time
            # between user interactions.
            proxy_read_timeout 3600s;
        }

        # JSON API on /api/v1/*.
        location /api/ {
            proxy_pass http://tmt_os_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # TODO: TLS termination. Add `listen 443 ssl http2;` plus a
        # `ssl_certificate` / `ssl_certificate_key` block reading from
        # /etc/nginx/ssl/ once the SSL material is provisioned.
    }
}